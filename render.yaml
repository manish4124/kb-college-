services:
  - type: web
    name: kb-college-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: your_mysql_password
      - key: DB_NAME
        value: KBCOLLEGE
      - key: CORS_ORIGIN
        value: https://your-frontend-domain.vercel.app
      - key: PYTHON_BIN
        value: python
